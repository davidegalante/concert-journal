name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -f https://mcclmbmtbsjusbkwslwv.supabase.co/rest/v1/ \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
